name: Build Play Store AAB

on:
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-35 build-tools;35.0.0

      - name: Install dependencies
        run: npm ci

      - name: Sync web app into Android project
        run: npx cap sync android

      - name: Point Gradle at the Android SDK
        run: echo "sdk.dir=${ANDROID_HOME}" >> android/local.properties

      - name: Decode release keystore
        if: ${{ secrets.PLAY_KEYSTORE_BASE64 != '' }}
        env:
          PLAY_KEYSTORE_BASE64: ${{ secrets.PLAY_KEYSTORE_BASE64 }}
        run: echo "$PLAY_KEYSTORE_BASE64" | base64 -d > android/plate-upload.keystore

      - name: Write keystore.properties
        if: ${{ secrets.PLAY_KEYSTORE_BASE64 != '' }}
        env:
          PLAY_KEYSTORE_PASSWORD: ${{ secrets.PLAY_KEYSTORE_PASSWORD }}
          PLAY_KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
          PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
        run: |
          cat > android/keystore.properties <<EOF
          storeFile=plate-upload.keystore
          storePassword=${PLAY_KEYSTORE_PASSWORD}
          keyAlias=${PLAY_KEY_ALIAS}
          keyPassword=${PLAY_KEY_PASSWORD}
          EOF

      - name: Require signing for Play bundle
        if: ${{ secrets.PLAY_KEYSTORE_BASE64 == '' }}
        run: |
          echo "::error::Add GitHub secrets PLAY_KEYSTORE_BASE64, PLAY_KEYSTORE_PASSWORD, PLAY_KEY_ALIAS, PLAY_KEY_PASSWORD (see store/CHECKLIST.md). Or build locally with scripts/build-play-aab.sh"
          exit 1

      - name: Build release app bundle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Upload AAB artifact
        uses: actions/upload-artifact@v4
        with:
          name: plate-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
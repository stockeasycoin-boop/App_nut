<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Plate — nutrition tracker</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap');

:root{
  --ink:#26241f;
  --paper:#eeeadf;
  --card:#f8f6ef;
  --line:#d8d2c1;
  --plum:#6b2d5c;
  --mustard:#c1932c;
  --teal:#2f6b5e;
  --rust:#a6472b;
  --muted:#8a8574;
  --good:#3f6b3a;
  --warn:#a6472b;
  --serif:'Fraunces', serif;
  --sans:'Inter', sans-serif;
  --mono:'IBM Plex Mono', monospace;
}
*{box-sizing:border-box;}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);}
body{padding-top:env(safe-area-inset-top);}
#root{max-width:460px;margin:0 auto;padding:18px 14px 60px;}

.brand{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:2px;}
.brand h1{font-family:var(--serif);font-size:26px;font-weight:600;margin:0;letter-spacing:-0.02em;}
.brand .gear{cursor:pointer;font-size:20px;background:none;border:none;color:var(--ink);opacity:0.6;padding:6px;}
.brand .gear:active{opacity:1;}
.tagline{font-size:11.5px;color:var(--muted);font-family:var(--mono);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:16px;}

.datebar{display:flex;align-items:center;justify-content:space-between;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:16px;}
.datebar button{background:none;border:none;font-size:16px;cursor:pointer;color:var(--ink);padding:4px 10px;}
.datebar button:disabled{opacity:0.25;cursor:default;}
.datebar .label{font-family:var(--mono);font-size:13px;font-weight:500;}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:16px;}

.ring-wrap{display:flex;flex-direction:column;align-items:center;}
.ring-svg{width:220px;height:220px;}

.legend{display:grid;grid-template-columns:1fr 1fr;gap:8px 14px;width:100%;margin-top:14px;}
.legend-item{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:12px;}
.dot{width:9px;height:9px;border-radius:50%;flex:none;}
.legend-item .val{margin-left:auto;color:var(--muted);}

.section-title{font-family:var(--mono);font-size:11px;text-transform:uppercase;letter-spacing:0.09em;color:var(--muted);margin:0 0 10px;}

.bar-row{margin-bottom:11px;}
.bar-row:last-child{margin-bottom:0;}
.bar-top{display:flex;justify-content:space-between;font-size:12.5px;font-family:var(--mono);margin-bottom:4px;}
.bar-top .name{color:var(--ink);}
.bar-top .amt{color:var(--muted);}
.bar-track{height:7px;border-radius:5px;background:var(--line);overflow:hidden;}
.bar-fill{height:100%;border-radius:5px;}

.trend-bars{position:relative;display:flex;align-items:flex-end;gap:6px;height:92px;}
.tcol{flex:1;height:100%;display:flex;align-items:flex-end;}
.tbar-fill{width:100%;border-radius:4px 4px 2px 2px;}
.tgoal{position:absolute;left:0;right:0;border-top:1px dashed var(--muted);opacity:0.65;pointer-events:none;}
.tgoal span{position:absolute;right:0;top:-13px;font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:0.06em;text-transform:uppercase;}
.trend-labels{display:flex;gap:6px;margin-top:6px;}
.trend-labels .tlabel{flex:1;text-align:center;font-family:var(--mono);font-size:10px;color:var(--muted);}
.trend-labels .tnow{color:var(--ink);font-weight:600;}
.tstats{display:flex;justify-content:space-between;margin-top:12px;padding-top:10px;border-top:1px dashed var(--line);font-family:var(--mono);font-size:11.5px;color:var(--muted);}

.portion{margin-bottom:14px;padding:12px;background:var(--card);border:1px solid var(--line);border-radius:10px;}
.portion-top{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
.portion-top .plabel{font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);}
.portion-top .pval{font-family:var(--mono);font-size:13px;font-weight:500;}
.portion input[type=range]{width:100%;accent-color:var(--plum);margin:0;}

.add-btn{width:100%;background:var(--ink);color:var(--paper);border:none;border-radius:10px;padding:14px;font-family:var(--sans);font-weight:600;font-size:15px;cursor:pointer;margin-bottom:16px;letter-spacing:0.01em;}
.add-btn:active{opacity:0.85;}

.receipt{font-family:var(--mono);}
.receipt-empty{font-size:13px;color:var(--muted);text-align:center;padding:18px 0;font-family:var(--sans);}
.receipt-item{display:flex;align-items:flex-start;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line);}
.receipt-item:last-child{border-bottom:none;}
.receipt-item .thumb{width:38px;height:38px;border-radius:8px;object-fit:cover;flex:none;background:var(--line);}
.receipt-item .meta{flex:1;min-width:0;}
.receipt-item .rname{font-family:var(--sans);font-size:13.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.receipt-item .rtime{font-size:11px;color:var(--muted);}
.receipt-item .rcal{font-size:13px;font-weight:500;white-space:nowrap;}
.receipt-item .rdel{background:none;border:none;color:var(--muted);cursor:pointer;font-size:15px;padding:2px 4px;}
.receipt-item .rdel:active{color:var(--rust);}

.overlay{position:fixed;inset:0;background:rgba(38,36,31,0.55);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
.sheet{background:var(--paper);width:100%;max-width:460px;border-radius:18px 18px 0 0;padding:20px 18px calc(26px + env(safe-area-inset-bottom));max-height:88vh;overflow-y:auto;}
.sheet h2{font-family:var(--serif);font-size:21px;margin:0 0 4px;}
.sheet .sub{font-size:12.5px;color:var(--muted);margin-bottom:16px;}
.close-x{position:absolute;top:14px;right:16px;background:none;border:none;font-size:18px;color:var(--muted);cursor:pointer;}
.sheet-inner{position:relative;}

.choice-row{display:flex;flex-direction:column;gap:10px;}
.choice{display:flex;align-items:center;gap:12px;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:14px;cursor:pointer;font-family:var(--sans);}
.choice .ic{font-size:20px;}
.choice .t{font-weight:600;font-size:14px;}
.choice .d{font-size:11.5px;color:var(--muted);}
.choice input[type=file]{display:none;}

.login{display:flex;flex-direction:column;align-items:center;text-align:center;padding:56px 8px 0;min-height:70vh;}
.login-mark{font-size:52px;line-height:1;margin-bottom:18px;}
.login h1{font-family:var(--serif);font-size:40px;font-weight:600;margin:0;letter-spacing:-0.02em;}
.login-tag{font-size:11.5px;color:var(--muted);font-family:var(--mono);text-transform:uppercase;letter-spacing:0.08em;margin-top:6px;}
.login-copy{font-size:14px;color:var(--muted);line-height:1.6;max-width:320px;margin:26px 0 32px;}
.login .primary-btn{max-width:300px;margin-top:0;}
.login-note{font-size:11.5px;color:var(--muted);font-family:var(--mono);margin-top:14px;}

select{
  width:100%;font-family:var(--sans);font-size:14px;padding:10px 11px;border:1px solid var(--line);
  border-radius:9px;background:var(--card);color:var(--ink);appearance:none;
  background-image:url("data:image/svg+xml;charset=UTF-8,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 12 8'%3E%3Cpath fill='%238a8574' d='M1 1l5 5 5-5'/%3E%3C/svg%3E");
  background-repeat:no-repeat;background-position:right 11px center;background-size:11px;padding-right:30px;
}

.prof-box{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:11px 12px;}
.prof-line{font-family:var(--mono);font-size:12px;color:var(--ink);}

textarea, input[type=text], input[type=password], input[type=number]{
  width:100%;font-family:var(--sans);font-size:14px;padding:10px 11px;border:1px solid var(--line);
  border-radius:9px;background:var(--card);color:var(--ink);
}
textarea{min-height:70px;resize:vertical;}
label.f{display:block;font-family:var(--mono);font-size:10.5px;text-transform:uppercase;letter-spacing:0.06em;color:var(--muted);margin:12px 0 4px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 12px;}

.primary-btn{width:100%;background:var(--ink);color:var(--paper);border:none;border-radius:10px;padding:13px;font-weight:600;font-size:14.5px;cursor:pointer;margin-top:18px;}
.ghost-btn{width:100%;background:none;color:var(--muted);border:none;padding:10px;font-size:13px;cursor:pointer;margin-top:4px;}
.primary-btn:disabled{opacity:0.5;}

.loading-wrap{display:flex;flex-direction:column;align-items:center;padding:30px 0;gap:12px;}
.spinner{width:30px;height:30px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--plum);animation:spin 0.8s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}
.loading-msg{font-family:var(--mono);font-size:12px;color:var(--muted);}

.err-box{background:#f3e6e2;border:1px solid var(--rust);color:var(--rust);border-radius:9px;padding:10px 12px;font-size:12.5px;margin-top:10px;}
.note-box{background:#e9efe8;border:1px solid var(--good);color:var(--good);border-radius:9px;padding:10px 12px;font-size:12.5px;margin-top:10px;}

.imgpreview{width:100%;max-height:180px;object-fit:cover;border-radius:10px;margin-bottom:14px;}

.goal-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:9px;}
.goal-row .gname{font-size:13px;font-family:var(--sans);}
.goal-row input{width:90px;text-align:right;}
</style>
</head>
<body>
<div id="root"></div>

<script>
(function(){

const API_URL = "https://api.groq.com/openai/v1/chat/completions";
// Groq's vision-capable model. It's a reasoning model, so we send
// reasoning_effort:"none" to skip the <think> preamble and get JSON directly.
const MODEL = "qwen/qwen3.6-27b";

const MACROS = [
  {key:'protein_g', label:'Protein', color:'#6b2d5c', unit:'g'},
  {key:'carbs_g', label:'Carbs', color:'#c1932c', unit:'g'},
  {key:'fat_g', label:'Fat', color:'#2f6b5e', unit:'g'},
  {key:'fiber_g', label:'Fiber', color:'#a6472b', unit:'g'},
];
const LIMIT_FIELDS = [
  {key:'sugar_g', label:'Sugar', unit:'g'},
  {key:'sodium_mg', label:'Sodium', unit:'mg'},
];
const MICROS = [
  {key:'vitamin_c_mg', label:'Vitamin C', unit:'mg'},
  {key:'vitamin_a_mcg', label:'Vitamin A', unit:'mcg'},
  {key:'calcium_mg', label:'Calcium', unit:'mg'},
  {key:'iron_mg', label:'Iron', unit:'mg'},
  {key:'potassium_mg', label:'Potassium', unit:'mg'},
];
const NUTRITION_KEYS = ['calories','protein_g','carbs_g','fat_g','fiber_g','sugar_g','sodium_mg',
  'vitamin_c_mg','vitamin_a_mcg','calcium_mg','iron_mg','potassium_mg'];

const ACTIVITY_LEVELS = [
  {key:'sedentary', label:'Sedentary', desc:'Desk job, little exercise', factor:1.2},
  {key:'light', label:'Lightly active', desc:'Light exercise 1-3 days/week', factor:1.375},
  {key:'moderate', label:'Moderately active', desc:'Exercise 3-5 days/week', factor:1.55},
  {key:'very', label:'Very active', desc:'Hard exercise 6-7 days/week', factor:1.725},
  {key:'athlete', label:'Athlete', desc:'Training twice a day', factor:1.9},
];
const GOAL_TYPES = [
  {key:'lose', label:'Lose weight', adjust:-500, proteinPerKg:2.0},
  {key:'maintain', label:'Maintain', adjust:0, proteinPerKg:1.6},
  {key:'gain', label:'Build muscle', adjust:400, proteinPerKg:1.8},
];

const DEFAULT_GOALS = {
  calories:2000, protein_g:50, carbs_g:275, fat_g:65, fiber_g:28,
  sugar_g:50, sodium_mg:2300,
  vitamin_c_mg:90, vitamin_a_mcg:900, calcium_mg:1000, iron_mg:18, potassium_mg:3400
};

function todayStr(d){
  const dt = d || new Date();
  return dt.getFullYear()+'-'+String(dt.getMonth()+1).padStart(2,'0')+'-'+String(dt.getDate()).padStart(2,'0');
}
function prettyDate(str){
  const [y,m,d] = str.split('-').map(Number);
  const dt = new Date(y, m-1, d);
  const today = todayStr();
  const yest = todayStr(new Date(Date.now()-86400000));
  if(str===today) return 'Today';
  if(str===yest) return 'Yesterday';
  return dt.toLocaleDateString(undefined,{month:'short', day:'numeric', year: (y!==new Date().getFullYear()? 'numeric':undefined)});
}

let state = {
  screen: 'login',
  profile: null,
  date: todayStr(),
  goals: null,
  entries: [],
  modal: null,
  addStep: 'choose',
  draftText: '',
  draftImageBase64: null,
  draftImageMedia: null,
  draftImagePreview: null,
  draftEntry: null,
  portion: 1,
  error: null,
  settingsSaved: false,
};

// ---------- persistence (localStorage) ----------
function loadGoals(){
  try{
    const raw = localStorage.getItem('dl_goals');
    if(raw){ state.goals = JSON.parse(raw); return; }
  }catch(e){}
  state.goals = {...DEFAULT_GOALS};
  try{ localStorage.setItem('dl_goals', JSON.stringify(state.goals)); }catch(e){}
}
function saveGoals(g){
  state.goals = g;
  try{ localStorage.setItem('dl_goals', JSON.stringify(g)); }catch(e){}
}
function loadEntries(date){
  try{
    const raw = localStorage.getItem('dl_entries_'+date);
    state.entries = raw ? JSON.parse(raw) : [];
  }catch(e){ state.entries = []; }
}
function saveEntries(date, entries){
  try{ localStorage.setItem('dl_entries_'+date, JSON.stringify(entries)); }
  catch(e){ console.error(e); }
}
function loadProfile(){
  try{
    const raw = localStorage.getItem('dl_profile');
    state.profile = raw ? JSON.parse(raw) : null;
  }catch(e){ state.profile = null; }
}
function saveProfile(p){
  state.profile = p;
  try{ localStorage.setItem('dl_profile', JSON.stringify(p)); }catch(e){}
}

// Mifflin-St Jeor BMR -> TDEE -> goal-adjusted targets.
function computeTargets(p){
  const kg = Number(p.weight_kg)||70;
  const cm = Number(p.height_cm)||170;
  const age = Number(p.age)||30;
  let bmr = 10*kg + 6.25*cm - 5*age;
  if(p.sex === 'male') bmr += 5;
  else if(p.sex === 'female') bmr -= 161;
  else bmr -= 78; // midpoint when unspecified

  const act = ACTIVITY_LEVELS.find(a=>a.key===p.activity) || ACTIVITY_LEVELS[0];
  const goalType = GOAL_TYPES.find(g=>g.key===p.goal) || GOAL_TYPES[1];
  // Never prescribe below a conservative floor, even for aggressive deficits.
  const floor = p.sex === 'female' ? 1200 : 1500;
  const calories = Math.max(floor, Math.round((bmr*act.factor + goalType.adjust)/10)*10);

  const protein_g = Math.round(kg * goalType.proteinPerKg);
  const fat_g = Math.round((calories*0.27)/9);
  const carbs_g = Math.max(0, Math.round((calories - protein_g*4 - fat_g*9)/4));
  const fiber_g = Math.round(calories/1000*14);

  return {
    ...DEFAULT_GOALS,
    calories, protein_g, carbs_g, fat_g, fiber_g,
    sugar_g: Math.round(calories*0.10/4),   // WHO: under 10% of energy
    sodium_mg: 2300,
  };
}
function bmiOf(p){
  const kg = Number(p.weight_kg), m = Number(p.height_cm)/100;
  if(!kg || !m) return null;
  return Math.round((kg/(m*m))*10)/10;
}

function getApiKey(){ return localStorage.getItem('dl_api_key') || ''; }
function setApiKey(k){ localStorage.setItem('dl_api_key', k.trim()); }

function computeTotals(entries){
  const t = {};
  NUTRITION_KEYS.forEach(k=>t[k]=0);
  entries.forEach(e=>{
    NUTRITION_KEYS.forEach(k=>{ t[k] += (Number(e.nutrition[k])||0); });
  });
  return t;
}
function clampPct(v, goal){
  if(!goal) return 0;
  return Math.max(0, Math.min(1, v/goal));
}

// ---------- history / streaks ----------
function entriesFor(date){
  if(date === state.date) return state.entries;
  try{
    const raw = localStorage.getItem('dl_entries_'+date);
    return raw ? JSON.parse(raw) : [];
  }catch(e){ return []; }
}
function shiftDate(date, delta){
  const [y,m,d] = date.split('-').map(Number);
  return todayStr(new Date(y, m-1, d+delta));
}
// The 7 days ending on the day being viewed, oldest first.
function lastNDays(n){
  const out = [];
  for(let i=n-1;i>=0;i--){
    const date = shiftDate(state.date, -i);
    const entries = entriesFor(date);
    out.push({date, entries, totals: computeTotals(entries), logged: entries.length>0});
  }
  return out;
}
// A day "hits" when calories land in 85-110% of goal and protein + fiber are met.
function dayHitsGoals(totals, goals){
  if(!goals.calories) return false;
  const cal = totals.calories / goals.calories;
  return cal >= 0.85 && cal <= 1.10
    && totals.protein_g >= goals.protein_g
    && totals.fiber_g >= goals.fiber_g;
}
function currentStreak(goals){
  let streak = 0;
  let cursor = state.date;
  // Don't punish a today that's still in progress — start from yesterday if today is a miss.
  if(!dayHitsGoals(computeTotals(entriesFor(cursor)), goals)) cursor = shiftDate(cursor, -1);
  for(let i=0;i<365;i++){
    if(!dayHitsGoals(computeTotals(entriesFor(cursor)), goals)) break;
    streak++;
    cursor = shiftDate(cursor, -1);
  }
  return streak;
}

// ---------- login + profile screens ----------
function renderLogin(root){
  root.innerHTML = `
    <div class="login">
      <div class="login-mark">&#127869;</div>
      <h1>Plate</h1>
      <div class="login-tag">a running tally of what's on your plate</div>
      <p class="login-copy">
        Snap a photo of your meal and get calories, macros and micronutrients
        estimated for you &mdash; then track them against goals built around your body.
      </p>
      <button class="primary-btn" id="loginBtn">Log in</button>
      <div class="login-note">
        No account needed. Everything stays on this device.
      </div>
    </div>
  `;
  document.getElementById('loginBtn').onclick = ()=>{
    try{ localStorage.setItem('dl_signed_in','1'); }catch(e){}
    state.screen = state.profile ? 'app' : 'profile';
    render();
  };
}

function profileField(p, key, label, unit, placeholder, attrs){
  return `
    <label class="f">${label}${unit?` (${unit})`:''}</label>
    <input type="number" id="p-${key}" value="${p[key]!=null?p[key]:''}" placeholder="${placeholder||''}" ${attrs||''}/>
  `;
}

function renderProfile(root, isEdit){
  const p = state.profile || {sex:'', activity:'sedentary', goal:'maintain'};
  root.innerHTML = `
    <div class="brand"><h1>${isEdit?'Your profile':'About you'}</h1></div>
    <div class="tagline">${isEdit?'update anytime':'step 1 of 1'}</div>

    <div class="card">
      <div class="sub" style="margin-bottom:4px;">
        We use these to work out your daily calorie and macro targets. You can
        override any target afterwards in Settings.
      </div>

      <label class="f">Name (optional)</label>
      <input type="text" id="p-name" value="${escapeHtml(p.name||'')}" placeholder="What should we call you?"/>

      <div class="grid2">
        <div>${profileField(p,'age','Age','years','30',' min="13" max="120"')}</div>
        <div>
          <label class="f">Sex</label>
          <select id="p-sex">
            <option value=""${!p.sex?' selected':''}>Prefer not to say</option>
            <option value="female"${p.sex==='female'?' selected':''}>Female</option>
            <option value="male"${p.sex==='male'?' selected':''}>Male</option>
          </select>
        </div>
      </div>

      <div class="grid2">
        <div>${profileField(p,'height_cm','Height','cm','170',' min="90" max="250"')}</div>
        <div>${profileField(p,'weight_kg','Weight','kg','70',' min="25" max="300" step="0.1"')}</div>
      </div>

      <label class="f">Activity level</label>
      <select id="p-activity">
        ${ACTIVITY_LEVELS.map(a=>`<option value="${a.key}"${p.activity===a.key?' selected':''}>${a.label} &mdash; ${a.desc}</option>`).join('')}
      </select>

      <label class="f">Goal</label>
      <select id="p-goal">
        ${GOAL_TYPES.map(g=>`<option value="${g.key}"${p.goal===g.key?' selected':''}>${g.label}</option>`).join('')}
      </select>

      <div id="targetPreview"></div>
      ${state.error?`<div class="err-box">${state.error}</div>`:''}
      <button class="primary-btn" id="saveProfile">${isEdit?'Save &amp; recalculate targets':'Calculate my targets'}</button>
      ${isEdit?'<button class="ghost-btn" id="cancelProfile">Cancel</button>':''}
    </div>
  `;

  const read = ()=>({
    name: document.getElementById('p-name').value.trim(),
    age: Number(document.getElementById('p-age').value)||null,
    sex: document.getElementById('p-sex').value,
    height_cm: Number(document.getElementById('p-height_cm').value)||null,
    weight_kg: Number(document.getElementById('p-weight_kg').value)||null,
    activity: document.getElementById('p-activity').value,
    goal: document.getElementById('p-goal').value,
  });

  const preview = ()=>{
    const d = read();
    const box = document.getElementById('targetPreview');
    if(!d.age || !d.height_cm || !d.weight_kg){ box.innerHTML = ''; return; }
    const t = computeTargets(d);
    const bmi = bmiOf(d);
    box.innerHTML = `
      <div class="note-box" style="margin-top:16px;">
        <strong>${t.calories} kcal/day</strong> &middot; ${t.protein_g}g protein &middot;
        ${t.carbs_g}g carbs &middot; ${t.fat_g}g fat &middot; ${t.fiber_g}g fiber
        ${bmi?`<br/><span style="opacity:0.8;">BMI ${bmi}</span>`:''}
      </div>`;
  };

  ['p-age','p-sex','p-height_cm','p-weight_kg','p-activity','p-goal'].forEach(id=>{
    const el = document.getElementById(id);
    el.oninput = preview; el.onchange = preview;
  });
  preview();

  document.getElementById('saveProfile').onclick = ()=>{
    const d = read();
    if(!d.age || !d.height_cm || !d.weight_kg){
      state.error = 'Age, height and weight are needed to calculate your targets.';
      render();
      return;
    }
    saveProfile(d);
    saveGoals(computeTargets(d));

    render();
  };

function ringSvg(totals, goals){
  const cx=110, cy=110;
  const radii = [96, 80, 64, 48];
  const width = 12;
  let rings = '';
  MACROS.forEach((m, i)=>{
    const r = radii[i];
    const circ = 2*Math.PI*r;
    const pct = clampPct(totals[m.key], goals[m.key]);
    const dash = circ*pct;
    rings += `
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="#d8d2c1" stroke-width="${width}"/>
      <circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${m.color}" stroke-width="${width}"
        stroke-dasharray="${dash} ${circ}" stroke-linecap="round"
        transform="rotate(-90 ${cx} ${cy})"/>
    `;
  });
  return `
    <div class="ring-wrap">
      <svg class="ring-svg" viewBox="0 0 220 220">
        ${rings}
        <text x="110" y="104" text-anchor="middle" font-family="Fraunces, serif" font-size="30" font-weight="600" fill="#26241f">${Math.round(totals.calories)}</text>
        <text x="110" y="124" text-anchor="middle" font-family="IBM Plex Mono, monospace" font-size="10" fill="#8a8574">of ${goals.calories} kcal</text>
      </svg>
      <div class="legend">
        ${MACROS.map(m=>`
          <div class="legend-item">
            <span class="dot" style="background:${m.color}"></span>
            <span>${m.label}</span>
            <span class="val">${Math.round(totals[m.key])}/${goals[m.key]}${m.unit}</span>
          </div>`).join('')}
      </div>
    </div>
  `;
}

function trendCard(goals){
  const days = lastNDays(7);
  const streak = currentStreak(goals);
  const loggedDays = days.filter(d=>d.logged);
  const avg = loggedDays.length
    ? Math.round(loggedDays.reduce((s,d)=>s+d.totals.calories,0)/loggedDays.length)
    : 0;
  // Scale bars against whichever is taller: the goal or the biggest day.
  const peak = Math.max(goals.calories, ...days.map(d=>d.totals.calories), 1);
  const goalPct = (goals.calories/peak)*100;

  const dowOf = (date)=>{
    const [y,m,d] = date.split('-').map(Number);
    return new Date(y, m-1, d).toLocaleDateString(undefined,{weekday:'narrow'});
  };
  const bars = days.map(d=>{
    const hit = dayHitsGoals(d.totals, goals);
    const h = (d.totals.calories/peak)*100;
    const color = !d.logged ? 'var(--line)' : (hit ? 'var(--good)' : 'var(--mustard)');
    return `<div class="tcol"><div class="tbar-fill" style="height:${Math.max(h,2)}%;background:${color};"></div></div>`;
  }).join('');
  const labels = days.map(d=>
    `<div class="tlabel${d.date===state.date?' tnow':''}">${dowOf(d.date)}</div>`
  ).join('');

  return `
    <div class="card">
      <div class="section-title">Last 7 days</div>
      <div class="trend-bars">
        <div class="tgoal" style="bottom:${goalPct}%;"><span>goal</span></div>
        ${bars}
      </div>
      <div class="trend-labels">${labels}</div>
      <div class="tstats">
        <span>${streak>0 ? `&#128293; ${streak}-day streak` : 'No streak yet'}</span>
        <span>avg ${avg} kcal</span>
      </div>
    </div>
  `;
}

function barRow(f, totals, goals, isLimit){
  const val = totals[f.key]||0;
  const goal = goals[f.key]||1;
  const pct = clampPct(val, goal);
  const over = val > goal;
  const color = isLimit ? (over ? '#a6472b' : '#c1932c') : (pct>=1 ? '#3f6b3a' : '#2f6b5e');
  return `
    <div class="bar-row">
      <div class="bar-top">
        <span class="name">${f.label}${isLimit?' (limit)':''}</span>
        <span class="amt">${Math.round(val)} / ${goal}${f.unit}</span>
      </div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct*100}%;background:${color};"></div></div>
    </div>
  `;
}

function escapeHtml(s){

function changeDay(delta){
  const [y,m,d] = state.date.split('-').map(Number);
  const dt = new Date(y, m-1, d+delta);

  if(next > todayStr()) return;
  state.date = next;
  loadEntries(state.date);
  render();

function deleteEntry(id){

function resizeImage(file){
  return new Promise((resolve, reject)=>{
    const reader = new FileReader();
    reader.onload = ()=>{
      const img = new Image();
      img.onload = ()=>{
        const maxDim = 800;
        let width = img.width, height = img.height;
        if(width>height && width>maxDim){ height = height*(maxDim/width); width=maxDim; }
        else if(height>maxDim){ width = width*(maxDim/height); height=maxDim; }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img,0,0,width,height);
        resolve(canvas.toDataURL('image/jpeg', 0.75));
      };
      img.onerror = reject;
      img.src = reader.result;
    };
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}

async function handlePhoto(file){
  if(!file) return;
  if(!getApiKey()){
    state.error = 'Add your API key in Settings first, or use manual entry.';
    render();
    return;
  }
  try{
    const dataUrl = await resizeImage(file);
    state.draftImagePreview = dataUrl;
    state.draftImageBase64 = dataUrl.split(',')[1];
    state.draftImageMedia = 'image/jpeg';
    state.addStep = 'loading';
    render();
    await callVisionModel([
      {type:"image_url", image_url:{url: "data:image/jpeg;base64," + state.draftImageBase64}},
      {type:"text", text: buildPrompt()}
    ], 'choose');
  }catch(e){
    state.error = 'Could not read that image. Try a different photo or enter values manually.';
    state.addStep = 'choose';
    render();
  }
}

function buildPrompt(){
  return `You are a nutrition estimation assistant. Estimate the nutrition content of the food shown/described.
Respond with ONLY a raw JSON object (no markdown fences, no commentary) matching exactly this schema:
{"name": string, "calories": number, "protein_g": number, "carbs_g": number, "fat_g": number, "fiber_g": number, "sugar_g": number, "sodium_mg": number, "vitamin_c_mg": number, "vitamin_a_mcg": number, "calcium_mg": number, "iron_mg": number, "potassium_mg": number}
All numeric fields are your best-effort estimate for the total visible/described portion, using standard nutrition references. Use 0 if truly negligible. Keep "name" short (a few words).`;
}

function parseJsonResponse(text){
  let cleaned = text.trim();
  // Reasoning models can still emit a <think> block; drop it before parsing.
  cleaned = cleaned.replace(/<think>[\s\S]*?<\/think>/gi,'').trim();
  cleaned = cleaned.replace(/^```json/i,'').replace(/^```/,'').replace(/```$/,'').trim();
  const start = cleaned.indexOf('{');
  const end = cleaned.lastIndexOf('}');
  if(start===-1||end===-1) throw new Error('no json found');
  return JSON.parse(cleaned.slice(start, end+1));
}

async function callVisionModel(content, errorReturnStep){
  try{
    const response = await fetch(API_URL, {
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "Authorization": "Bearer " + getApiKey()
      },
      body: JSON.stringify({
        model: MODEL,
        max_tokens: 1000,
        temperature: 0.2,
        reasoning_effort: "none",
        response_format: {type: "json_object"},
        messages:[{ role:"user", content }]
      })
    });
    if(response.status===401){
      throw {friendly:'That API key was rejected. Double-check it in Settings.'};
    }
    if(response.status===429){
      throw {friendly:'Free-tier rate limit hit. Wait a minute and try again.'};
    }
    if(!response.ok){
      throw {friendly:'The request failed ('+response.status+'). Check your connection and try again.'};
    }
    const data = await response.json();
    const text = data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content;
    if(!text) throw new Error('no response');
    const parsed = parseJsonResponse(text);
    state.draftEntry = normalizeParsed(parsed);
    state.error = null;
    state.addStep = 'confirm';
  }catch(e){
    console.error(e);
    state.error = (e && e.friendly) || "Couldn't get an estimate. Try again or enter values manually.";
    state.addStep = errorReturnStep;
  }
  render();
}

async function analyzeDescription(){
  if(!state.draftText || !state.draftText.trim()){
    state.error = 'Type a short description first.';
    render();
    return;
  }
  if(!getApiKey()){
    state.error = 'Add your API key in Settings first, or use manual entry.';
    render();
    return;
  }
  state.addStep = 'loading';
  state.error = null;
  state.draftImagePreview = null;
  render();
  await callVisionModel(buildPrompt() + "\n\nFood description: " + state.draftText, 'describe');
}

function normalizeParsed(p){
  const out = {name: p.name || 'Food item'};
  NUTRITION_KEYS.forEach(k=>{ out[k] = Number(p[k])||0; });
  return out;
}

function commitEntry(host){
  const name = host.querySelector('#f-name').value.trim() || 'Food item';
  const nutrition = {};
  nutrition.calories = Number(host.querySelector('#f-calories').value)||0;
  [...MACROS, ...LIMIT_FIELDS, ...MICROS].forEach(m=>{
    nutrition[m.key] = Number(host.querySelector('#f-'+m.key).value)||0;
  });
  const entry = {
    id: 'e'+Date.now()+Math.random().toString(36).slice(2,7),
    ts: Date.now(),
    name,
    nutrition,
    thumb: state.draftImagePreview || null
  };
  state.entries.push(entry);
  saveEntries(state.date, state.entries);
  closeModal();
}

// ---------- init ----------
loadGoals();
loadProfile();
loadEntries(state.date);
// Returning users land straight in the app; the login screen is the first-run gate.
state.screen = localStorage.getItem('dl_signed_in') ? 'app' : 'login';
if(state.screen === 'app' && !state.profile) state.screen = 'profile';
render();

})();
</script>
</body>
